name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, cloudflare-build, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          for (const name of ['required-checks', 'cloudflare-build', 'fallow-audit']) {
            const result = needs[name]?.result;
            const expectedSkip = name === 'fallow-audit' && process.env.EVENT_NAME !== 'pull_request' && result === 'skipped';
            if (result !== 'success' && !expectedSkip) {
              console.error(`${name}: ${result ?? 'missing'}`);
              process.exitCode = 1;
            }
          }
          NODE

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare

  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit changed code
        uses: fallow-rs/fallow@85fa32733e951df85966842f2bb6a3f2720a940c # v3.37.0
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          # Re-resolve generated types instead of restoring stale missing-import results.
          no-cache: true

  required-checks:
    name: Required checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mise-action saves a cache only when install is true, and that path adds
      # --locked. This lock has no Java URL, so the tools install with
      # `mise install` and actions/cache stores them. The key includes the
      # lock hash (PLAN) and the OS, so Linux and macOS do not share a JDK.
      # mise.toml also pins the TLC jar. A hit that has only Java still
      # installs the jar. Dependabot keeps its own cache, and the macOS copy
      # was saved without the jar.
      - name: Restore mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: false
          cache: false

      - name: Install mise tools
        run: mise install

      - name: Install Playwright
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # Each OS job gets its own database. The script uses the non-pooled host.
      # Dependabot has no secret, so the script skips. Any other missing secret fails.
      - name: Create a private test database
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/ci-test-database.mjs create

      - name: Verify
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: make verify

      - name: Drop the private test database
        if: always()
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: node scripts/ci-test-database.mjs drop
